<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Wheel + Transition Signals</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f4;--fg:#1f2430;--card:#fff;--line:#d9d4c8;--accent:#2f6f5e;--muted:#6b7080}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a20;--fg:#eef0f3;--card:#1f262e;--line:#3a4450;--accent:#6fcfb4;--muted:#9aa3b0}}
:root[data-theme="dark"]{--bg:#151a20;--fg:#eef0f3;--card:#1f262e;--line:#3a4450;--accent:#6fcfb4;--muted:#9aa3b0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
.wheelbox{position:relative;max-width:420px;margin:0 auto}
svg{width:100%;height:auto;display:block}
.rot{transition:transform 2.4s cubic-bezier(.15,.7,.15,1);transform-origin:200px 200px}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:1.6rem;color:var(--accent)}
button{font-family:system-ui,sans-serif;font-size:1rem;border:0;border-radius:10px;padding:12px 22px;background:var(--accent);color:#fff;cursor:pointer}
[data-theme="dark"] button,@media (prefers-color-scheme:dark){}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:10px;justify-content:center;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:system-ui,sans-serif}
.card b{color:var(--accent)}
textarea{width:100%;box-sizing:border-box;min-height:80px;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:1rem Georgia,serif}
#fb{margin-top:8px;min-height:1.4em;font-family:system-ui,sans-serif;font-size:.92rem}
:root:root{--bg:#0b0820;--fg:#f3eeff;--card:rgba(30,20,70,.7);--line:#6d4cff;--accent:#ff4fd8;--muted:#b9a9f0}
body{background:radial-gradient(circle at 50% 0,#2a1160 0,#0b0820 60%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#9ff,transparent),radial-gradient(2px 2px at 40% 80%,#f9f,transparent),radial-gradient(1.5px 1.5px at 85% 15%,#fff,transparent);background-size:300px 300px;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
h1{text-align:center;color:#fff;text-shadow:0 0 8px #ff4fd8,0 0 22px #ff4fd8,0 0 40px #7a4bff}
p.sub{text-align:center}
svg{filter:drop-shadow(0 0 14px #ff4fd8aa) drop-shadow(0 0 30px #5b3bff88)}
.pointer{color:#ffe14f;text-shadow:0 0 12px #ffe14f;z-index:2;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translate(-50%,5px)}}
button{background:linear-gradient(135deg,#ff4fd8,#7a4bff);box-shadow:0 0 16px #ff4fd899;transition:transform .15s}
button:hover{transform:scale(1.06)}button:active{transform:scale(.96)}
button.alt{background:transparent;border:1px solid #ff4fd8;color:#ffd1f5;box-shadow:0 0 10px #ff4fd855}
.card{box-shadow:0 0 18px #6d4cff66;border-color:#6d4cff;color:var(--fg)}
textarea{border-color:#6d4cff}
.bulb{fill:#ffe14f;animation:bl 1s infinite alternate}
.bulb:nth-child(even){animation-delay:.5s;fill:#ff4fd8}
@keyframes bl{from{opacity:.25}to{opacity:1}}
#res.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style></head><body><canvas id="fx"></canvas><main>
<h1>Idea Wheel + Transition Signals</h1>
<p class="sub">Topic: Social Media and Students. Spin, then link the idea to another idea using a signal from the outer wheel.</p>
<div class="wheelbox"><div class="pointer">▼</div>
<svg viewBox="-12 -12 424 424" role="img" aria-label="Two concentric wheels: transition categories outside, ideas inside">
<g id="outer" class="rot"></g><g id="inner" class="rot"></g>
<circle cx="200" cy="200" r="14" fill="var(--card)" stroke="var(--line)"/></svg></div>
<div class="row"><button id="spin">Spin!</button><button class="alt" id="hint">Show signals</button><button class="alt" id="mute">🔊</button></div>
<div class="card" id="res">Press <b>Spin</b> to get an idea and a signal type.</div>
<textarea id="ans" placeholder="Write your sentence here…"></textarea>
<div class="row" style="margin-top:8px"><button class="alt" id="check">Check my sentence</button></div>
<div id="fb"></div>
</main>
<script>
const ideas=["Social media helps students communicate","Students spend hours scrolling","Teachers use it to share homework","Grades can drop","Students find information quickly","Sleep time decreases"];
const cats=[["Addition",["moreover","in addition","furthermore","additionally","also","besides","what is more","as well as","another","likewise","similarly","equally important"],"#2f6f5e"],["Contrast",["however","on the other hand","but","yet","although","though","even though","while","whereas","nevertheless","nonetheless","in contrast","on the contrary","despite","in spite of","instead","otherwise","still"],"#b5533c"],["Cause / Effect",["therefore","as a result","consequently","thus","hence","so","because","because of","since","due to","owing to","for this reason","accordingly","as a consequence","that is why"],"#3f6fa8"],["Example",["for instance","for example","such as","like","in particular","especially","namely","to illustrate","including","to demonstrate"],"#9a7b1f"],["Sequence",["first","firstly","first of all","second","secondly","third","next","then","after that","afterwards","meanwhile","before","after","later","eventually","subsequently","at the same time","finally","lastly"],"#7a4f9a"],["Conclusion",["in conclusion","to conclude","to sum up","in summary","to summarize","in short","in brief","overall","all in all","on the whole","in the end","to put it simply","ultimately"],"#566270"]];
const NS="http://www.w3.org/2000/svg",R=Math.PI/180;
function pt(r,a){return[200+r*Math.sin(a*R),200-r*Math.cos(a*R)]}
function ring(id,items,r0,r1,fill,size){const g=document.getElementById(id);
items.forEach((it,i)=>{const a0=i*60,a1=a0+60;const[p1,p2,p3,p4]=[pt(r1,a0),pt(r1,a1),pt(r0,a1),pt(r0,a0)];
const p=document.createElementNS(NS,"path");p.setAttribute("d",`M${p1}A${r1},${r1} 0 0 1 ${p2}L${p3}A${r0},${r0} 0 0 0 ${p4}Z`);
p.setAttribute("fill",fill(i));p.setAttribute("stroke","var(--bg)");p.setAttribute("stroke-width","2");g.appendChild(p);
const t=document.createElementNS(NS,"text");const m=pt((r0+r1)/2,a0+30);t.setAttribute("x",m[0]);t.setAttribute("y",m[1]);
t.setAttribute("text-anchor","middle");t.setAttribute("fill","#fff");t.setAttribute("font-family","system-ui,sans-serif");t.setAttribute("font-size",size);
t.setAttribute("transform",`rotate(${a0+30} ${m[0]} ${m[1]})`);
it.forEach((ln,k)=>{const s=document.createElementNS(NS,"tspan");s.setAttribute("x",m[0]);s.setAttribute("dy",k?size+1:-(it.length-1)*(size+1)/2+size/3);s.textContent=ln;t.appendChild(s)});
g.appendChild(t)})}
function wrap(s,n){const w=s.split(" ");const o=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>n){o.push(c);c=x}else c=(c+" "+x).trim()});o.push(c);return o}
ring("outer",cats.map(c=>c[0].split(" / ").length>1?["Cause /","Effect"]:[c[0]]),135,195,i=>cats[i][2],12);
ring("inner",ideas.map(s=>wrap(s,14)),20,128,i=>["#3d7f6e","#4a7ba6","#8a6aa8","#b0644e","#a38a2e","#5c6b7a"][i],9.5);
let rO=0,rI=0,cur=null;
document.getElementById("spin").onclick=()=>{
 const ii=Math.floor(Math.random()*6),ci=Math.floor(Math.random()*6);
 rI=-(ii*60+30)+360*(Math.ceil(-rI/360)+3);rO=-(ci*60+30)-360*(Math.ceil(rO/360)+3)+0;
 rO=-(ci*60+30)+360*(Math.floor(rO/360)+4);
 document.getElementById("inner").style.transform=`rotate(${rI}deg)`;
 document.getElementById("outer").style.transform=`rotate(${rO}deg)`;
 cur={ii,ci};document.getElementById("fb").textContent="";ticks();
 setTimeout(()=>{chime();boom(40);const r0=document.getElementById("res");r0.classList.remove("pop");void r0.offsetWidth;r0.classList.add("pop");const c=cats[ci];document.getElementById("res").innerHTML=`<b>Idea:</b> ${ideas[ii]}<br><b>Signal type:</b> ${c[0]} (${c[1].join(", ")})<br><span style="color:var(--muted)">Join this idea to another one using a ${c[0].toLowerCase()} signal.</span>`},2500)};
document.getElementById("hint").onclick=()=>{document.getElementById("res").innerHTML=cats.map(c=>`<b>${c[0]}:</b> ${c[1].join(", ")}`).join("<br>")};
document.getElementById("check").onclick=()=>{const t=document.getElementById("ans").value.toLowerCase(),f=document.getElementById("fb");
 if(!cur){f.textContent="Spin first!";return}
 const sig=cats[cur.ci][1].find(s=>new RegExp("\\b"+s+"\\b").test(t));
 if(sig){chime();boom(120)}else if(t.trim())buzz();f.innerHTML=!t.trim()?"Write a sentence first.":sig?`✅ Nice! You used “${sig}” correctly as a ${cats[cur.ci][0].toLowerCase()} signal.`:`❌ Try again with one of: ${cats[cur.ci][1].join(", ")}.`};
let AC=null,muted=false;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type,v){if(muted)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.08,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d)}catch(e){}}
function ticks(){for(let n=0;n<40;n++)tone(600+n*8,2.4*Math.sqrt(n/40),.05,"square",.04)}
function chime(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.4,"triangle",.1))}
function buzz(){tone(140,0,.35,"sawtooth",.08)}
document.getElementById("mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊"};
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function boom(n){for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*12,vy:-Math.random()*10-2,c:`hsl(${Math.random()*360},90%,60%)`,s:4+Math.random()*5,l:90});if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});if(P.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
const sv=document.querySelector("svg"),bg=document.createElementNS(NS,"g");
for(let i=0;i<28;i++){const c=document.createElementNS(NS,"circle"),p=pt(201,i*360/28);c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",4);c.setAttribute("class","bulb");bg.appendChild(c)}
sv.insertBefore(bg,sv.firstChild);
document.getElementById("check").onclick=()=>{const raw=document.getElementById("ans").value.trim(),t=raw.toLowerCase(),f=document.getElementById("fb");
if(!cur){f.textContent="Spin first!";return}
if(!raw){f.textContent="Write a sentence first.";return}
const sig=cats[cur.ci][1].find(s=>new RegExp("\\b"+s+"\\b").test(t));
const keys=ideas[cur.ii].toLowerCase().split(" ").filter(w=>w.length>4);
const hit=keys.filter(k=>t.includes(k.slice(0,5))).length;
const miss=[];
if(!sig)miss.push(`use a ${cats[cur.ci][0].toLowerCase()} signal (e.g. ${cats[cur.ci][1].slice(0,3).join(", ")})`);
if(hit<Math.min(2,keys.length))miss.push(`include the idea: “${ideas[cur.ii]}”`);
if(raw.split(/\s+/).length<8)miss.push("write at least 8 words");
if(!/^[A-Z]/.test(raw))miss.push("start with a capital letter");
if(!/[.!?]$/.test(raw))miss.push("end with a full stop");
if(miss.length){buzz();f.innerHTML="❌ Not complete yet. Please:<br>• "+miss.join("<br>• ")}
else{chime();boom(120);f.innerHTML=`✅ Complete sentence! You used “${sig}” correctly.`}};
</script></body></html>
